services:
  backend-prod:
    build:
      context: .
      dockerfile: Deploy/prod/php/Dockerfile
    image: app-php:prod
    container_name: backend-prod
    restart: always
    networks:
      - app-net

  nginx-prod:
    build:
      context: ./Deploy/prod/nginx
      dockerfile: Dockerfile
    image: app-nginx:prod
    container_name: nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./laravel/public:/var/www/html/public:ro
    depends_on:
      - backend-prod
    networks:
      - app-net

  postgres-prod:
    build:
      context: ./Deploy/prod/postgres
      dockerfile: Dockerfile
    image: app-postgres:prod
    container_name: postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    networks:
      - app-net

  pgadmin-prod:
    build:
      context: ./Deploy/prod/pgadmin
      dockerfile: Dockerfile
    image: app-pgadmin:prod
    container_name: pgadmin-prod
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres-prod
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  pgdata-prod:
