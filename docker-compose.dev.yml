
services:
  backend-dev:
    build:
      context: ./Deploy/dev/php
      dockerfile: Dockerfile
    image: app-php:dev
    container_name: backend-dev
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./laravel:/var/www/html
    networks:
      - app-net

  frontend-dev:
    build:
      context: ./Deploy/dev/node
      dockerfile: Dockerfile
    image: app-node:dev
    container_name: frontend-dev
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./laravel:/app
    command: npm run dev -- --host
    networks:
      - app-net

  nginx-dev:
    build:
      context: ./Deploy/dev/nginx
      dockerfile: Dockerfile
    image: app-nginx:dev
    container_name: nginx-dev
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./laravel:/var/www/html
    depends_on:
      - backend-dev
    networks:
      - app-net

  postgres-dev:
    build:
      context: ./Deploy/dev/postgres
      dockerfile: Dockerfile
    image: app-postgres:dev
    container_name: postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: laravel_dev
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: secure_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    networks:
      - app-net

  pgadmin-dev:
    build:
      context: ./Deploy/dev/pgadmin
      dockerfile: Dockerfile
    image: app-pgadmin:dev
    container_name: pgadmin-dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    depends_on:
      - postgres-dev
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  pgdata-dev:
